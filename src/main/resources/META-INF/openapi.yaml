      description: "Requires the case-sensitive Admin role. Creates one DRAFT with four options and one correct. EXAMPLE references an existing reading; CUSTOM owns its sentence. Duplicate source and target range returns 409; different targets are allowed. All mutations require the current version except creation. Failed writes roll back completely."
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/QuizQuestionCreateRequest"
            examples:
              custom:
                summary: "Standalone CUSTOM draft"
                value:
                  content:
                    sourceType: "CUSTOM"
                    sentenceReading: "\u304c\u3063\u3053\u3046\u3078\u3044\u304f"
                    targetStart: 0
                    targetLength: 4
                    targetReading: "\u304c\u3063\u3053\u3046"
                    levelIds: [ ]
                    lessonIds: [ ]
                  options:
                    - text: "\u5b66\u6821"
                      correct: true
                    - text: "\u5b66\u751f"
                      correct: false
                    - text: "\u5148\u751f"
                      correct: false
                    - text: "\u96fb\u8eca"
                      correct: false
              example:
                summary: "EXAMPLE draft; source ID 1 must match the target"
                value:
                  content:
                    sourceType: "EXAMPLE"
                    targetStart: 0
                    targetLength: 4
                    targetReading: "\u304c\u3063\u3053\u3046"
                    levelIds: [ ]
                    lessonIds: [ ]
                    exampleId: 1
                  options:
                    - text: "\u5b66\u6821"
                      correct: true
                    - text: "\u5b66\u751f"
                      correct: false
                    - text: "\u5148\u751f"
                      correct: false
                    - text: "\u96fb\u8eca"
                      correct: false
