        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/VocabularyMeaningUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VocabularyMeaningResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/meanings/{meaningId}:
    put:
      operationId: updateVocabularyMeaning
      summary: Update a vocabulary meaning
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. Only vi and en are accepted.
        Multiple primary meanings, or no primary meaning, are allowed; other meanings are not automatically
        demoted. Duplicate language and meaning within this vocabulary returns 409.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/meaningId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyMeaningUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyMeaningResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/pitch-accents:
    post:
      operationId: addVocabularyPitchAccents
      summary: Add vocabulary pitch accents
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. The body readingId must belong to this vocabulary (404
        otherwise). Duplicate readingId and accentPattern returns 409.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/VocabularyPitchAccentUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VocabularyPitchAccentResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/pitch-accents/{pitchAccentId}:
    put:
      operationId: updateVocabularyPitchAccent
      summary: Update a vocabulary pitch accent
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. The body readingId must belong
        to this vocabulary (404 otherwise). Duplicate readingId and accentPattern returns 409. The accent
        may be moved to another reading of this vocabulary.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/pitchAccentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyPitchAccentUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyPitchAccentResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/examples:
    post:
      operationId: addVocabularyExamples
      summary: Add vocabulary examples
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. Duplicate japaneseText, japaneseReading and targetText
        within this vocabulary returns 409. exampleId identifies the example sentence, not a separate
        assignment ID. Creates a new sentence for each item.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/VocabularyExampleUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VocabularyExampleResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/examples/{exampleId}:
    put:
      operationId: updateVocabularyExample
      summary: Update a vocabulary example
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. Duplicate japaneseText,
        japaneseReading and targetText within this vocabulary returns 409. exampleId identifies the example
        sentence, not a separate assignment ID. If the sentence is shared with another vocabulary, changes
        to japaneseText, japaneseReading, meaningVi or meaningEn return 409. targetText and displayOrder may
        still change locally.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/exampleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyExampleUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyExampleResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/levels:
    post:
      operationId: addLevelAssignments
      summary: Assign existing JLPT levels
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. The level code must already exist (404 otherwise);
        duplicate assignments return 409. Does not create master data.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/LevelAssignmentAddRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VocabularyLevelResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/levels/{levelId}:
    put:
      operationId: updateLevelAssignmentOrder
      summary: Update level assignment order
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. Changes assignment
        displayOrder only, not level master data. levelId is the existing JLPT level ID, not an assignment
        ID. displayOrder may be zero.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/levelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentOrderUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyLevelResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/lessons:
    post:
      operationId: addLessonAssignments
      summary: Assign existing lessons
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. The lesson must already exist (404 otherwise), and its
        JLPT level must already be assigned to this vocabulary (400 otherwise). Duplicate assignments return
        409. Does not create master data.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/LessonAssignmentAddRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VocabularyLessonResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/lessons/{lessonId}:
    put:
      operationId: updateLessonAssignmentOrder
      summary: Update lesson assignment order
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. Changes assignment
        displayOrder only, not lesson master data. lessonId is the existing lesson ID, not an assignment ID.
        displayOrder must be at least 1; zero returns 400 even though the shared
        AssignmentOrderUpdateRequest DTO permits zero for levels.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/lessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssignmentOrderUpdateRequest'
                - type: object
                  properties:
                    displayOrder:
                      type: integer
                      format: int32
                      minimum: 1
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyLessonResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/parts-of-speech:
    post:
      operationId: addPartOfSpeechAssignments
      summary: Assign existing parts of speech
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. The POS code must already exist (404 otherwise);
        duplicate assignments return 409. Does not create master data. These assignments have no update
        fields or update operation.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/PartOfSpeechAssignmentAddRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VocabularyPartOfSpeechResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/kanji:
    post:
      operationId: addVocabularyKanji
      summary: Create or attach kanji
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. character, strokeCount, meaningVi and meaningEn are
        kanji metadata; displayOrder belongs to this vocabulary assignment. Omitted or null optional
        metadata is treated as null, not as an instruction to retain its previous value. Creates a kanji if
        the character is new; otherwise attaches existing kanji only when all metadata matches exactly (409
        otherwise). An existing assignment returns 409.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/KanjiUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VocabularyKanjiResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/kanji/{kanjiId}:
    put:
      operationId: updateVocabularyKanji
      summary: Update assigned kanji
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. character, strokeCount,
        meaningVi and meaningEn are kanji metadata; displayOrder belongs to this vocabulary assignment.
        Omitted or null optional metadata is treated as null, not as an instruction to retain its previous
        value. If shared with another vocabulary, metadata changes return 409, but local displayOrder may
        change. A character belonging to another kanji returns 409.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/kanjiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KanjiUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyKanjiResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/kanji/{kanjiId}/readings:
    post:
      operationId: addKanjiReadings
      summary: Add kanji readings
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. The kanji must be assigned to this vocabulary (404
        otherwise). Kanji shared with another vocabulary cannot have readings added (409). Duplicate reading
        and readingType within the kanji returns 409.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/kanjiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/KanjiReadingUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/KanjiReadingResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/kanji/{kanjiId}/readings/{readingId}:
    put:
      operationId: updateKanjiReading
      summary: Update a kanji reading
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. readingId is a kanji reading
        ID (returned as kanjiReadingId), not a vocabulary reading ID. It must belong to the specified kanji,
        which must be assigned to this vocabulary (404 otherwise). Shared kanji cannot have readings
        updated, even with unchanged values (409). Duplicate reading and readingType within the kanji
        returns 409.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/kanjiId'
        - $ref: '#/components/parameters/kanjiReadingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KanjiReadingUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/KanjiReadingResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Send the Auth Service JWT access token in Authorization as Bearer <token>. Admin Vocabulary operations require the case-sensitive Admin value in the role claim.
  parameters:
    vocabularyId:
      name: vocabularyId
      in: path
      required: true
      description: Target vocabulary ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    readingId:
      name: readingId
      in: path
      required: true
      description: Vocabulary reading ID; must belong to the vocabulary in the URL.
      schema:
        type: integer
        format: int64
        minimum: 1
    meaningId:
      name: meaningId
      in: path
      required: true
      description: Meaning ID; must belong to the vocabulary in the URL.
      schema:
        type: integer
        format: int64
        minimum: 1
    pitchAccentId:
      name: pitchAccentId
      in: path
      required: true
      description: Pitch accent ID; its reading must belong to the vocabulary in the URL.
      schema:
        type: integer
        format: int64
        minimum: 1
    exampleId:
      name: exampleId
      in: path
      required: true
      description: Example sentence ID; must be associated with this vocabulary.
      schema:
        type: integer
        format: int64
        minimum: 1
    levelId:
      name: levelId
      in: path
      required: true
      description: JLPT level master-data ID; must already be assigned to this vocabulary.
      schema:
        type: integer
        format: int64
        minimum: 1
    lessonId:
      name: lessonId
      in: path
      required: true
      description: Lesson master-data ID; must already be assigned to this vocabulary.
      schema:
        type: integer
        format: int64
        minimum: 1
    kanjiId:
      name: kanjiId
      in: path
      required: true
      description: Kanji ID; must already be assigned to this vocabulary.
      schema:
        type: integer
        format: int64
        minimum: 1
    kanjiReadingId:
      name: readingId
      in: path
      required: true
      description: Kanji reading ID returned as kanjiReadingId; must belong to this kanji and vocabulary relationship.
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    LessonWriteRequest:
      type: object
      required: [ levelId, lessonNumber, title, displayOrder ]
      properties:
        levelId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Existing JLPT level ID. Required and non-null.
        lessonNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Required and non-null; unique within levelId.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Required and non-null; must contain a non-whitespace character (Jakarta NotBlank).
        description:
          type: [ string, 'null' ]
          maxLength: 1000
          description: Optional. Omitted or null clears the description on update.
        displayOrder:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Required and non-null; unique within levelId.
    LessonResponse:
      description: Existing lesson representation. Null description is omitted from JSON.
      type: object
      required: [ id, lessonNumber, title ]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        lessonNumber:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
          maxLength: 200
        description:
          type: [ string, 'null' ]
          maxLength: 1000
    FlashcardDetailResponse:
      type: object
      required: [ vocabulary, readings, meanings, partsOfSpeech, levels, lessons, kanji, examples ]
      properties:
        vocabulary:
          $ref: '#/components/schemas/VocabularyResponse'
        readings:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardReadingResponse'
        meanings:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardMeaningResponse'
        partsOfSpeech:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardPartOfSpeechResponse'
        levels:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardLevelResponse'
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardLessonResponse'
        kanji:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardKanjiResponse'
        examples:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardExampleResponse'
    VocabularyResponse:
      type: object
      required: [ id, word, normalizedWord ]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Persisted vocabulary.id; vocabularyId in Admin paths.
        word:
          type: string
        normalizedWord:
          type: string
    FlashcardReadingResponse:
      type: object
      required: [ readingId, reading, isPrimary, displayOrder, pitchAccents, pitchAccentDetails ]
      properties:
        readingId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted vocabulary_readings.id; readingId in the Admin vocabulary reading PUT path.
        reading:
          type: string
        isPrimary:
          type: boolean
        displayOrder:
          type: integer
          format: int32
          description: From vocabulary_readings. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
        pitchAccents:
          type: array
          description: Existing learner representation; accent patterns only.
          items:
            type: integer
            format: int32
            minimum: 0
            maximum: 65535
        pitchAccentDetails:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardPitchAccentResponse'
    FlashcardMeaningResponse:
      type: object
      required: [ meaningId, languageCode, meaning, isPrimary, displayOrder ]
      properties:
        meaningId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted vocabulary_meanings.id; meaningId in the Admin meaning PUT path.
        languageCode:
          type: string
          description: Map to language in the Admin meaning request.
        meaning:
          type: string
        isPrimary:
          type: boolean
        displayOrder:
          type: integer
          format: int32
          description: From vocabulary_meanings. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    FlashcardPitchAccentResponse:
      type: object
      required: [ pitchAccentId, accentPattern ]
      properties:
        pitchAccentId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted vocabulary_pitch_accents.id; pitchAccentId in the Admin PUT path; the containing reading supplies readingId.
        accentPattern:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
    FlashcardLevelResponse:
      type: object
      required: [ levelId, code, name, displayOrder ]
      properties:
        levelId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted jlpt_levels.id; master-data ID; together with vocabularyId identifies the vocabulary_levels assignment.
        code:
          type: string
        name:
          type: string
        displayOrder:
          type: [ integer, 'null' ]
          format: int32
          description: From vocabulary_levels, not jlpt_levels; nullable in the database. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    FlashcardLessonResponse:
      type: object
      required: [ lessonId, levelCode, levelName, lessonNumber, title, description, displayOrder, assignmentDisplayOrder ]
      properties:
        lessonId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted lessons.id; master-data ID; together with vocabularyId identifies the lesson_vocabulary assignment.
        levelCode:
          type: string
        levelName:
          type: string
        lessonNumber:
          type: integer
          format: int32
          description: Lesson number within its level.
        title:
          type: string
        description:
          type: [ string, 'null' ]
        displayOrder:
          type: integer
          format: int32
          description: Existing lesson master-data order from lessons.display_order; not the editable vocabulary assignment order.
        assignmentDisplayOrder:
          type: integer
          format: int32
          description: From lesson_vocabulary.display_order (SQL INT, default 0); Admin assignment writes require a positive value.
    FlashcardPartOfSpeechResponse:
      type: object
      required: [ code, nameVi, nameEn ]
      properties:
        code:
          type: string
        nameVi:
          type: string
        nameEn:
          type: string
    FlashcardExampleResponse:
      type: object
      required: [ exampleId, japaneseText, japaneseReading, meaningVi, meaningEn, targetText, displayOrder ]
      properties:
        exampleId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted example_sentences.id; exampleId in the Admin PUT path, scoped by the vocabulary_examples association. Shared sentence content restrictions still apply.
        japaneseText:
          type: string
        japaneseReading:
          type: string
        meaningVi:
          type: string
        meaningEn:
          type: string
        targetText:
          type: string
        displayOrder:
          type: integer
          format: int32
          description: From vocabulary_examples. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    FlashcardKanjiResponse:
      type: object
      required: [ kanjiId, character, strokeCount, meaningVi, meaningEn, readings, displayOrder ]
      properties:
        kanjiId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted kanji.id; kanjiId in the Admin PUT path, scoped by vocabulary_kanji. Shared metadata restrictions still apply.
        character:
          type: string
        strokeCount:
          type: [ integer, 'null' ]
          format: int32
          description: Persisted stroke count.
        meaningVi:
          type: [ string, 'null' ]
        meaningEn:
          type: [ string, 'null' ]
        readings:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardKanjiReadingResponse'
        displayOrder:
          type: integer
          format: int32
          description: From vocabulary_kanji. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    FlashcardKanjiReadingResponse:
      type: object
      required: [ kanjiReadingId, reading, readingType, displayOrder ]
      properties:
        kanjiReadingId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted kanji_readings.id; readingId in the nested Admin kanji reading PUT path, not a vocabulary reading ID. Shared kanji restrictions still apply.
        reading:
          type: string
        readingType:
          type: string
        displayOrder:
          type: integer
          format: int32
          description: From kanji_readings. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    AssignmentOrderUpdateRequest:
      type: object
      description: Assignment order only. Levels accept zero; lesson updates require at least 1.
      required: [ displayOrder ]
      properties:
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    KanjiReadingUpdateRequest:
      type: object
      required: [ reading, readingType, displayOrder ]
      properties:
        reading:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 100
        readingType:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank). No enum is enforced.
          maxLength: 20
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    KanjiUpdateRequest:
      type: object
      required: [ character, displayOrder ]
      properties:
        character:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 10
        strokeCount:
          type: [ integer, "null" ]
          format: int32
          description: Optional; omitted or null clears this metadata on update. Must match existing metadata when attaching existing kanji.
          minimum: 0
          maximum: 65535
        meaningVi:
          type: [ string, "null" ]
          description: Optional; omitted or null clears this metadata on update. Must match existing metadata when attaching existing kanji.
          maxLength: 500
        meaningEn:
          type: [ string, "null" ]
          description: Optional; omitted or null clears this metadata on update. Must match existing metadata when attaching existing kanji.
          maxLength: 500
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    LessonAssignmentAddRequest:
      type: object
      required: [ lessonId, displayOrder ]
      properties:
        lessonId:
          type: integer
          format: int64
          minimum: 1
        displayOrder:
          type: integer
          format: int32
          minimum: 1
    LevelAssignmentAddRequest:
      type: object
      required: [ level, displayOrder ]
      properties:
        level:
          type: string
          minLength: 1
