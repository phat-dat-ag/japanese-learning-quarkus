openapi: 3.1.0
info:
  title: Japanese Learning API
  version: 1.0.0
  description: >-
    Authenticated learner queries and Admin editing/import APIs. Supply an Auth Service JWT access token.
    Role names are case-sensitive. Success responses wrap data with success and meta; errors wrap error
    with success=false and meta. Null object fields are omitted. Numeric IDs are Java int64 values;
    Angular clients should avoid precision loss for IDs beyond JavaScript's safe integer range.
tags:
  - name: Flashcards
    description: Paged vocabulary cards and detailed learner content. User or Admin role required.
  - name: JLPT Levels
    description: JLPT level catalogue. User or Admin role required.
  - name: Lessons
    description: Lesson lookup and Admin-only lesson creation, update and file batches.
  - name: Vocabulary Imports
    description: Admin-only atomic vocabulary imports from JSON bodies or uploaded files.
  - name: Admin Vocabulary Core
    description: Admin-only edits to vocabulary word and normalized identity.
  - name: Admin Vocabulary Readings
    description: Admin-only vocabulary readings and primary-reading rules.
  - name: Admin Vocabulary Meanings
    description: Admin-only vocabulary meanings and languages.
  - name: Admin Vocabulary Pitch Accents
    description: Admin-only pitch accents associated with vocabulary readings.
  - name: Admin Vocabulary Examples
    description: Admin-only example sentences and vocabulary-specific example assignments.
  - name: Admin Vocabulary Assignments
    description: Admin-only JLPT level, lesson and part-of-speech assignments.
  - name: Admin Vocabulary Kanji
    description: Admin-only kanji assignments, metadata and nested kanji readings.
  - name: Admin Kanji Quiz
    description: Admin-only question bank, independent options and publication lifecycle.
security:
  - bearerAuth: [ ]
# Each tag follows one Resource class. Static schemas supply the typed data hidden by Uni<Response>.
paths:
  /api/v1/flashcards:
    get:
      operationId: getFlashcards
      summary: List flashcards
      tags: [ Flashcards ]
      description: >-
        Requires the User or Admin role. Lists vocabulary IDs and words for a JLPT level, optionally
        filtered by lesson number within that level. Pagination is zero-based; page multiplied by size
        must not exceed 2147483647. An unmatched filter or page beyond the result set returns an empty
        flashcardItems array. Pagination fields are inside data, not meta.
      parameters:
        - name: level
          in: query
          description: Defaults to N5 when omitted or blank; trimmed and converted to uppercase. Supported codes are N1, N2, N3, N4 and N5.
          schema:
            type: string
            default: N5
          example: N5
        - name: lesson
          in: query
          description: Optional positive lesson number within the selected level, not a lesson ID.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: page
          in: query
          description: Zero-based page index. The product of page and size must fit a signed 32-bit integer.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of flashcards per page (1-100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Successful response; data contains FlashcardListResponse.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/FlashcardListResponse'
        '400':
          description: FLASHCARD_VALIDATION_ERROR - invalid level, lesson number or pagination range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          description: FORBIDDEN - authenticated caller lacks the case-sensitive User or Admin role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '404':
          description: NOT_FOUND - a lesson, page or size query value cannot be parsed as an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/flashcards/{id}:
    get:
      tags: [ Flashcards ]
      operationId: getFlashcard
      summary: Get vocabulary flashcard detail
      description: >-
        Requires the User or Admin role. Includes persisted child IDs for existing Admin update operations. IDs do not grant
        write access or change shared example and kanji restrictions. Existing learner fields
        are preserved, including the integer pitchAccents array.
      parameters:
        - name: id
          description: Positive vocabulary ID returned by the flashcard list.
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Flashcard detail
          content:
            application/json:
              schema:
                type: object
                required: [ success, data, meta ]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FlashcardDetailResponse'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: FLASHCARD_VALIDATION_ERROR - vocabulary ID must be positive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          description: FORBIDDEN - authenticated caller lacks the case-sensitive User or Admin role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '404':
          description: VOCABULARY_NOT_FOUND - vocabulary does not exist; malformed path values can also return NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/jlpt-levels:
    get:
      operationId: getLevels
      summary: List JLPT levels
      tags: [ JLPT Levels ]
      description: Requires the User or Admin role. Returns level codes and names ordered by master-data display order; IDs are not included.
      responses:
        '200':
          description: Successful response; data contains an ordered array of JlptLevelResponse.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/JlptLevelResponse'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          description: FORBIDDEN - authenticated caller lacks the case-sensitive User or Admin role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/lessons:
    get:
      operationId: getLessons
      summary: List lessons by JLPT level
      tags: [ Lessons ]
      description: Requires the User or Admin role. Trims the level code and looks up the existing level. Returns lessons ordered by display order, or an empty array when that level has no lessons.
      parameters:
        - name: level
          in: query
          required: true
          description: Existing JLPT level code; must contain a non-whitespace character. Leading and trailing whitespace is trimmed.
          schema:
            type: string
            minLength: 1
          example: N5
      responses:
        '200':
          description: Successful response; data contains an ordered array of LessonResponse.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '404':
          description: JLPT_LEVEL_NOT_FOUND - the requested JLPT level does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          description: FORBIDDEN - authenticated caller lacks the case-sensitive User or Admin role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
    post:
      tags: [ Lessons ]
      operationId: createLesson
      summary: Create a lesson
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role. Writes all mutable lesson
        fields atomically. levelId must reference an existing JLPT level. Lesson number and display
        order must each be unique within that level. Omitted or null description leaves the new lesson without a description.
        Returns the created lesson representation.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonWriteRequest'
      responses:
        '200':
          description: Lesson saved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          description: JLPT_LEVEL_NOT_FOUND - referenced level does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '409':
          description: LESSON_CONFLICT - lesson number or display order already exists within the target JLPT level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/lessons/{lessonId}:
    put:
      tags: [ Lessons ]
      operationId: updateLesson
      summary: Update a lesson
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role. Writes all mutable lesson
        fields atomically. levelId must reference an existing JLPT level. Lesson number and display
        order must each be unique within that level. Omitted or null description clears it.
        Vocabulary assignments are preserved. Returns the existing lesson representation.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: lessonId
          in: path
          required: true
          description: Existing lesson ID to update.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonWriteRequest'
      responses:
        '200':
          description: Lesson saved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          description: JLPT_LEVEL_NOT_FOUND - referenced level does not exist; RESOURCE_NOT_FOUND - target lesson does not exist; NOT_FOUND - lessonId cannot be parsed as an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '409':
          description: LESSON_CONFLICT - lesson number or display order already exists within the target JLPT level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/lessons/batch:
    post:
      tags: [ Lessons ]
      operationId: createLessons
      summary: Create lessons independently (Admin only)
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role.
        Accepts one multipart file field named file (maximum 1 MiB / 1048576 bytes),
        containing a JSON array of 1 to 100 LessonWriteRequest objects. Filename and part Content-Type
        are not used to validate JSON; actual parsing is authoritative.
        Each item uses single-create validation and business rules.
        Items are processed sequentially in input order in separate transactions and sessions.
        A failed item rolls back only itself; successful items remain committed. No existing lesson
        is overwritten. Duplicate lessonNumber or displayOrder within a level, including earlier
        successful items in this request, produces LESSON_CONFLICT for that item.
        HTTP 200 means the batch was processed, even when some or all items failed, consistent with
        the existing single-create 200 convention. The envelope success is true; inspect each result's
        success and the summary counts. Indices are zero-based. Item errors include BAD_REQUEST
        (DTO validation or null item), JLPT_LEVEL_NOT_FOUND, LESSON_CONFLICT, and INTERNAL_SERVER_ERROR
        (safe generic persistence/unexpected failure). These do not become whole-request HTTP errors.
        Missing or empty files, non-array or malformed JSON (including trailing content), values that cannot bind to the DTO, null/empty arrays and arrays exceeding
        100 items fail the whole request before processing. A disconnected client may not receive
        results for items already committed; this operation is not an atomic or idempotent retry.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    JSON file, at most 1048576 bytes, containing an array of 1-100 LessonWriteRequest objects.
                    Example file content:
                    [{"levelId":1,"lessonNumber":1,"title":"Bai 1","description":null,"displayOrder":1},
                    {"levelId":1,"lessonNumber":2,"title":"Bai 2","description":null,"displayOrder":2}]
      responses:
        '200':
          description: Batch processed (all, some, or no items succeeded). Each success is committed independently.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/LessonBatchResponse'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '413':
          description: Uploaded file exceeds 1 MiB (1048576 bytes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/vocabularies:
    post:
      operationId: createVocabularies
      summary: Import a vocabulary batch (Admin only)
      tags: [ Vocabulary Imports ]
      description: >-
        Requires the case-sensitive Admin role. Imports a non-empty JSON array of VocabularyImportItem
        objects. The configured vocabulary.import.max-batch-size limit defaults to 500; deployments may
        override it. The whole batch is atomic: any failure rolls back all writes. Duplicate word values
        in one batch are rejected. Existing vocabulary is matched by normalizedWord and must have identical
        level and lesson sets; only new examples are appended and existing metadata is preserved.
        New vocabulary is fully created. updated counts matching existing entries, including unchanged repeats.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              description: Non-null items; maximum count is configured, default 500.
              items:
                $ref: '#/components/schemas/VocabularyImportItem'
            examples:
              minimal:
                $ref: '#/components/examples/VocabularyImport'
      responses:
        '200':
          description: Successful response; data contains ImportResult.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/ImportResult'
        '400':
          description: BAD_REQUEST for malformed request data; VALIDATION_ERROR for import validation failures, assignment mismatch, unknown lesson or part of speech, or configured batch limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '413':
          description: PAYLOAD_TOO_LARGE - request exceeds the configured HTTP body limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/vocabularies/import:
    post:
      operationId: importVocabularies
      summary: Import a vocabulary file (Admin only)
      tags: [ Vocabulary Imports ]
      description: >-
        Requires the case-sensitive Admin role. Imports a non-empty JSON array of VocabularyImportItem
        objects. The configured vocabulary.import.max-batch-size limit defaults to 500; deployments may
        override it. The whole batch is atomic: any failure rolls back all writes. Duplicate word values
        in one batch are rejected. Existing vocabulary is matched by normalizedWord and must have identical
        level and lesson sets; only new examples are appended and existing metadata is preserved.
        New vocabulary is fully created. updated counts matching existing entries, including unchanged repeats.
        Upload the JSON array as the file part. The filename and part Content-Type do not prove JSON
        validity; the server parses the content. The HTTP body-size limit is deployment-configured;
        this endpoint does not use the lesson batch endpoint's 1 MiB file limit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    JSON file containing a non-empty array of VocabularyImportItem objects (default maximum 500).
                    Example file content:
                    [{"word":"猫","normalizedWord":"猫","levels":["N5"],"lessons":[{"level":"N5","lessonNumber":1,"displayOrder":1}],"readings":[{"reading":"ねこ","isPrimary":true}],"meanings":[{"language":"en","meaning":"cat"}],"partsOfSpeech":["noun"],"examples":[{"japaneseText":"猫です。","japaneseReading":"ねこです。","meaningVi":"Con meo.","meaningEn":"It is a cat.","targetText":"猫"}]}]
                    Referenced lessons and part-of-speech codes must already exist.
      responses:
        '200':
          description: Successful response; data contains ImportResult.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/ImportResult'
        '400':
          description: BAD_REQUEST for malformed request data; VALIDATION_ERROR for invalid import data, assignment mismatch, unknown lesson or part of speech, or configured batch limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '413':
          description: PAYLOAD_TOO_LARGE - request exceeds the configured HTTP body limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}:
    put:
      operationId: updateVocabularyCore
      summary: Update vocabulary core fields
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. Only word and normalizedWord
        change. normalizedWord is supplied by the caller; a value belonging to another vocabulary returns
        409.
      tags: [ Admin Vocabulary Core ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyCoreUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyCoreResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/readings:
    post:
      operationId: addVocabularyReadings
      summary: Add vocabulary readings
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. The vocabulary must retain at least one primary reading
        (400 otherwise); multiple primary readings are allowed and other readings are not automatically
        demoted. Duplicate reading text within this vocabulary returns 409.
      tags: [ Admin Vocabulary Readings ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/VocabularyReadingUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VocabularyReadingResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/readings/{readingId}:
    put:
      operationId: updateVocabularyReading
      summary: Update a vocabulary reading
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. The vocabulary must retain at
        least one primary reading (400 otherwise); multiple primary readings are allowed and other readings
        are not automatically demoted. Duplicate reading text within this vocabulary returns 409.
      tags: [ Admin Vocabulary Readings ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/readingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyReadingUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyReadingResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/meanings:
    post:
      operationId: addVocabularyMeanings
      summary: Add vocabulary meanings
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. Only vi and en are accepted. Multiple primary meanings,
        or no primary meaning, are allowed; other meanings are not automatically demoted. Duplicate language
        and meaning within this vocabulary returns 409.
      tags: [ Admin Vocabulary Meanings ]
      security:
        - bearerAuth: [ ]
