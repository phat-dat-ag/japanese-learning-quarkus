        "404":
          description: "QUIZ_QUESTION_NOT_FOUND, QUIZ_OPTION_NOT_FOUND, QUIZ_REFERENCE_NOT_FOUND; NOT_FOUND for unparseable numeric path/query parameters."
          content:
