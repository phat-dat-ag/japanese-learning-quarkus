  responses:
    AdminEditErrorResponseStatus400:
      description: BAD_REQUEST for malformed JSON or Jakarta input validation (empty details); VALIDATION_ERROR for business validation (field details).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus401:
      description: UNAUTHORIZED - missing, invalid or expired JWT bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus403:
      description: FORBIDDEN - authenticated caller lacks the case-sensitive Admin role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus404:
      description: RESOURCE_NOT_FOUND - vocabulary, child, assignment or referenced master data does not exist in the required parent relationship. NOT_FOUND - a path ID cannot be parsed as an integer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus409:
      description: VOCABULARY_EDIT_CONFLICT - duplicate value or protected shared-data modification
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus415:
      description: UNSUPPORTED_MEDIA_TYPE - request Content-Type must match the media type documented in requestBody
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus500:
      description: INTERNAL_SERVER_ERROR - unexpected server failure; no internal diagnostic details are exposed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
