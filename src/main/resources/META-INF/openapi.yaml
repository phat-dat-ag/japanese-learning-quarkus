openapi: 3.1.0
info:
  title: Japanese Learning API
  version: 1.0.0
tags:
  - name: Admin Vocabulary
    description: Vocabulary editing requires a JWT bearer token with the case-sensitive Admin role. No DELETE operations are provided.
security:
  - bearerAuth: [ ]
paths:
  /api/v1/lessons:
    post:
      operationId: createLesson
      summary: Create a lesson
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role. Writes all mutable lesson
        fields atomically. levelId must reference an existing JLPT level. Lesson number and display
        order must each be unique within that level. Omitted or null description clears it.
        Vocabulary assignments are preserved. Returns the existing lesson representation.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonWriteRequest'
      responses:
        '200':
          description: Lesson saved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          description: JLPT_LEVEL_NOT_FOUND - referenced level does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '409':
          description: LESSON_CONFLICT - lesson number or display order already exists within the target JLPT level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/lessons/{lessonId}:
    put:
      operationId: updateLesson
      summary: Update a lesson
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role. Writes all mutable lesson
        fields atomically. levelId must reference an existing JLPT level. Lesson number and display
        order must each be unique within that level. Omitted or null description clears it.
        Vocabulary assignments are preserved. Returns the existing lesson representation.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: lessonId
          in: path
          required: true
          description: Existing lesson ID to update.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonWriteRequest'
      responses:
        '200':
          description: Lesson saved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/LessonResponse'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          description: JLPT_LEVEL_NOT_FOUND - referenced level does not exist; RESOURCE_NOT_FOUND - target lesson does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '409':
          description: LESSON_CONFLICT - lesson number or display order already exists within the target JLPT level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEditErrorResponse'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/flashcards/{id}:
    get:
      operationId: getFlashcard
      summary: Get vocabulary flashcard detail
      description: >-
        Includes persisted child IDs for existing Admin update operations. IDs do not grant
        write access or change shared example and kanji restrictions. Existing learner fields
        are preserved, including the integer pitchAccents array.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Flashcard detail
          content:
            application/json:
              schema:
                type: object
                required: [ success, data, meta ]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FlashcardDetailResponse'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Invalid vocabulary ID
        '401':
          description: Bearer token required
        '404':
          description: Vocabulary not found
  /api/vocabularies:
    post:
      responses:
        '200':
          description: Batch processed atomically. New vocabulary is fully created; matching existing vocabulary receives only new examples.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ImportResult'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Invalid vocabulary batch, assignment mismatch, missing lesson, or configured batch limit exceeded
        '401':
          description: Bearer token required
        '403':
          description: Admin role required
  /api/v1/admin/vocabularies/{vocabularyId}:
    put:
      operationId: updateVocabularyCore
      summary: Update vocabulary core fields
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. Only word and normalizedWord
        change. normalizedWord is supplied by the caller; a value belonging to another vocabulary returns
        409.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyCoreUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyCoreResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/readings:
    post:
      operationId: addVocabularyReadings
      summary: Add vocabulary readings
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
        of 1 to 100 non-null items, even for one item. The entire batch is atomic; any failure rolls back
        all additions. Results follow request order. The vocabulary must retain at least one primary reading
        (400 otherwise); multiple primary readings are allowed and other readings are not automatically
        demoted. Duplicate reading text within this vocabulary returns 409.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/VocabularyReadingUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VocabularyReadingResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/readings/{readingId}:
    put:
      operationId: updateVocabularyReading
      summary: Update a vocabulary reading
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Replaces the
        fields of this resource or assignment only. The vocabulary and every child or assignment in the URL
        must exist and belong to the specified parent; otherwise returns 404. The vocabulary must retain at
        least one primary reading (400 otherwise); multiple primary readings are allowed and other readings
        are not automatically demoted. Duplicate reading text within this vocabulary returns 409.
      tags: [ Admin Vocabulary ]
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/vocabularyId'
        - $ref: '#/components/parameters/readingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyReadingUpdateRequest'
      responses:
        '200':
          description: Operation completed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdminEditResponse'
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyReadingResult'
        '400':
          $ref: '#/components/responses/AdminEditErrorResponseStatus400'
        '401':
          $ref: '#/components/responses/AdminEditErrorResponseStatus401'
        '403':
          $ref: '#/components/responses/AdminEditErrorResponseStatus403'
        '404':
          $ref: '#/components/responses/AdminEditErrorResponseStatus404'
        '409':
          $ref: '#/components/responses/AdminEditErrorResponseStatus409'
        '415':
          $ref: '#/components/responses/AdminEditErrorResponseStatus415'
        '500':
          $ref: '#/components/responses/AdminEditErrorResponseStatus500'
  /api/v1/admin/vocabularies/{vocabularyId}/meanings:
    post:
      operationId: addVocabularyMeanings
      summary: Add vocabulary meanings
      description: >-
        Requires a JWT bearer token with the case-sensitive Admin role in the role claim. Send a JSON array
