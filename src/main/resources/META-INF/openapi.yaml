      description: "Requires the case-sensitive Admin role. Sets ARCHIVED and clears validation, excluding new games. Retains question/options and all session history; no delete endpoint. All mutations require the current version except creation. Failed writes roll back completely."
      security:
        - bearerAuth: [ ]
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Positive question ID."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/QuizVersionRequest"
            examples:
              request:
                value:
                  version: 0
      responses:
        "200":
          description: "Success with the common ApiResponse envelope."
          content:
            "application/json":
              examples:
                success:
                  $ref: '#/components/examples/QuizQuestionArchivedSuccess'
              schema:
                allOf:
                  - "$ref": "#/components/schemas/AdminEditResponse"
                  - type: "object"
                    required:
                      - "data"
                    properties:
                      data:
                        "$ref": "#/components/schemas/QuizQuestionResponse"
        "400":
          description: "BAD_REQUEST for malformed JSON or Jakarta validation; QUIZ_QUESTION_INVALID for domain validation, filters or pagination."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminEditErrorResponse"
        "404":
          description: "QUIZ_QUESTION_NOT_FOUND, QUIZ_OPTION_NOT_FOUND, QUIZ_REFERENCE_NOT_FOUND; NOT_FOUND for unparseable numeric path/query parameters."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminEditErrorResponse"
        "409":
          description: "QUIZ_QUESTION_CONFLICT for stale version, duplicate source/target, immutable source type, archived edit, or concurrent reference/constraint conflict."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminEditErrorResponse"
        "401":
          "$ref": "#/components/responses/AdminEditErrorResponseStatus401"
        "403":
          "$ref": "#/components/responses/AdminEditErrorResponseStatus403"
        "500":
          "$ref": "#/components/responses/AdminEditErrorResponseStatus500"
        "415":
          description: "UNSUPPORTED_MEDIA_TYPE - send application/json."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminEditErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Send the Auth Service JWT access token in Authorization as Bearer <token>. Read operations require User or Admin; write operations require the case-sensitive Admin value in the role claim.
  parameters:
    vocabularyId:
      name: vocabularyId
      in: path
      required: true
      description: Target vocabulary ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    readingId:
      name: readingId
      in: path
      required: true
      description: Vocabulary reading ID; must belong to the vocabulary in the URL.
      schema:
        type: integer
        format: int64
        minimum: 1
    meaningId:
      name: meaningId
      in: path
      required: true
      description: Meaning ID; must belong to the vocabulary in the URL.
      schema:
        type: integer
        format: int64
        minimum: 1
    pitchAccentId:
      name: pitchAccentId
      in: path
      required: true
      description: Pitch accent ID; its reading must belong to the vocabulary in the URL.
      schema:
        type: integer
        format: int64
        minimum: 1
    exampleId:
      name: exampleId
      in: path
      required: true
      description: Example sentence ID; must be associated with this vocabulary.
      schema:
        type: integer
        format: int64
        minimum: 1
    levelId:
      name: levelId
      in: path
      required: true
      description: JLPT level master-data ID; must already be assigned to this vocabulary.
      schema:
        type: integer
        format: int64
        minimum: 1
    lessonId:
      name: lessonId
      in: path
      required: true
      description: Lesson master-data ID; must already be assigned to this vocabulary.
      schema:
        type: integer
        format: int64
        minimum: 1
    kanjiId:
      name: kanjiId
      in: path
      required: true
      description: Kanji ID; must already be assigned to this vocabulary.
      schema:
        type: integer
        format: int64
        minimum: 1
    kanjiReadingId:
      name: readingId
      in: path
      required: true
      description: Kanji reading ID returned as kanjiReadingId; must belong to this kanji and vocabulary relationship.
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    QuizQuestionContentRequest:
      type: "object"
      description: "Complete editable content, not a patch. Omitted optional fields are cleared. EXAMPLE never edits source reading. Source type is immutable."
      required:
        - "sourceType"
        - "targetStart"
        - "targetLength"
        - "targetReading"
        - "levelIds"
        - "lessonIds"
      properties:
        sourceType:
          type: "string"
          enum:
            - "EXAMPLE"
            - "CUSTOM"
          description: "Immutable after creation."
        exampleId:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "Required for EXAMPLE, forbidden for CUSTOM. Existing source owned by Vocabulary."
        vocabularyId:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "Optional; for EXAMPLE it must be assigned to the source example."
        sentenceReading:
          type: "string"
          maxLength: 1000
          description: "CUSTOM only, required; forbidden for EXAMPLE. Limits count Unicode code points."
        targetStart:
          type: "integer"
          format: "int64"
          minimum: 0
          description: "Zero-based Unicode code-point offset, not UTF-16 or grapheme index."
        targetLength:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "Unicode code-point length; must fit the sentence."
        targetReading:
          type: "string"
          maxLength: 200
          description: "Exact selected segment, Hiragana/Katakana with voicing/prolonged marks. No source normalization."
        explanationVi:
          type: "string"
          maxLength: 2000
        explanationEn:
          type: "string"
          maxLength: 2000
        levelIds:
          type: "array"
          maxItems: 100
          uniqueItems: true
          items:
            type: "integer"
            format: "int64"
            minimum: 1
          description: "Explicit existing JLPT level IDs; required, may be empty."
        lessonIds:
          type: "array"
          maxItems: 100
          uniqueItems: true
          items:
            type: "integer"
            format: "int64"
            minimum: 1
          description: "Explicit existing lesson IDs; each lesson also implies its current level. Required, may be empty."
    QuizOptionRequest:
      type: "object"
      description: "One of exactly four options, exactly one correct. No display order."
      required:
        - "text"
        - "correct"
      properties:
        text:
          type: "string"
          maxLength: 200
          description: "Nonblank, no surrounding whitespace; NFKC-distinct within question."
        correct:
          type: "boolean"
    QuizQuestionCreateRequest:
      type: "object"
      description: "Creates a DRAFT; publication is explicit. Duplicate source identity and target range returns 409, including archived questions."
      required:
        - "content"
        - "options"
      properties:
        content:
          "$ref": "#/components/schemas/QuizQuestionContentRequest"
        options:
          type: "array"
          minItems: 4
          maxItems: 4
          items:
            "$ref": "#/components/schemas/QuizOptionRequest"
    QuizQuestionUpdateRequest:
      type: "object"
      description: "Replaces content/classifications; options keep stable IDs. Successful edits demote to DRAFT."
      required:
        - "version"
        - "content"
      properties:
        version:
          type: "integer"
          format: "int64"
          minimum: 0
          description: "Required current response version. Stale versions return 409; treat increments as opaque."
        content:
          "$ref": "#/components/schemas/QuizQuestionContentRequest"
    QuizOptionTextRequest:
      type: "object"
      description: "Changes only text of an option owned by this question; demotes to DRAFT."
      required:
        - "version"
        - "text"
      properties:
        version:
          type: "integer"
          format: "int64"
          minimum: 0
          description: "Required current response version. Stale versions return 409; treat increments as opaque."
        text:
          type: "string"
          maxLength: 200
    QuizCorrectOptionRequest:
      type: "object"
      description: "Atomically selects one owned option as correct; demotes to DRAFT."
      required:
        - "version"
        - "optionId"
      properties:
        version:
          type: "integer"
          format: "int64"
          minimum: 0
          description: "Required current response version. Stale versions return 409; treat increments as opaque."
        optionId:
          type: "integer"
          format: "int64"
          minimum: 1
    QuizVersionRequest:
      type: "object"
      description: "Lifecycle command with optimistic concurrency precondition."
      required:
        - "version"
      properties:
        version:
          type: "integer"
          format: "int64"
          minimum: 0
          description: "Required current response version. Stale versions return 409; treat increments as opaque."
    QuizOptionResponse:
      type: "object"
      description: "Stable bank option ID; array order has no presentation meaning."
      required:
        - "id"
        - "text"
        - "correct"
      properties:
        id:
          type: "integer"
          format: "int64"
          minimum: 1
        text:
          type: "string"
          maxLength: 200
        correct:
          type: "boolean"
    QuizQuestionResponse:
      type: "object"
      description: "Full Admin-only details. Correct answers must not be exposed by future Player APIs. Null fields omitted."
      required:
        - "id"
        - "version"
        - "sourceType"
        - "status"
        - "targetStart"
        - "targetLength"
        - "targetReading"
        - "sourceInvalidated"
        - "eligibleForNewGames"
        - "levelIds"
        - "lessonIds"
        - "options"
        - "createdAt"
        - "updatedAt"
      properties:
        id:
          type: "integer"
          format: "int64"
          minimum: 1
        version:
          type: "integer"
          format: "int64"
          minimum: 0
        sourceType:
          type: "string"
          enum:
            - "EXAMPLE"
            - "CUSTOM"
          description: "Immutable after creation."
        status:
          type: "string"
          enum:
            - "DRAFT"
            - "PUBLISHED"
            - "ARCHIVED"
        exampleId:
          type: "integer"
          format: "int64"
          minimum: 1
        vocabularyId:
          type: "integer"
          format: "int64"
          minimum: 1
        sentenceReading:
          type: "string"
          maxLength: 1000
          description: "Current source reading for EXAMPLE, owned reading for CUSTOM; omitted if source was deleted."
        targetStart:
          type: "integer"
          format: "int64"
          minimum: 0
        targetLength:
          type: "integer"
          format: "int64"
          minimum: 1
        targetReading:
          type: "string"
          maxLength: 200
        explanationVi:
          type: "string"
          maxLength: 2000
        explanationEn:
          type: "string"
          maxLength: 2000
        sourceInvalidated:
          type: "boolean"
          description: "EXAMPLE missing, never validated, or fingerprint changed. CUSTOM is false."
        eligibleForNewGames:
          type: "boolean"
          description: "PUBLISHED and source validation is current; session creation rechecks under locks."
        levelIds:
          type: "array"
          items:
            type: "integer"
            format: "int64"
            minimum: 1
        lessonIds:
          type: "array"
          items:
            type: "integer"
            format: "int64"
            minimum: 1
        options:
          type: "array"
          items:
            "$ref": "#/components/schemas/QuizOptionResponse"
        createdAt:
          type: "string"
          description: "UTC local ISO-8601 timestamp."
        updatedAt:
          type: "string"
          description: "UTC local ISO-8601 timestamp."
    QuizQuestionListResponse:
      type: "object"
      description: "Newest ID first; zero-based pagination inside data. Empty page for unmatched filters."
      required:
        - "items"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/QuizQuestionResponse"
        page:
          type: "integer"
          format: "int64"
          minimum: 0
        size:
          type: "integer"
          format: "int64"
          minimum: 1
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          format: "int64"
          minimum: 0
    JlptLevelResponse:
      type: object
      required: [ code, name ]
      properties:
        code:
          type: string
          description: JLPT level code, for example N5. This endpoint does not return a numeric level ID.
        name:
          type: string
          description: Display name of the level.
    FlashcardListItemResponse:
      type: object
      required: [ id, word ]
      properties:
        id:
          type: integer
          format: int64
          description: Vocabulary ID used for flashcard detail and Admin vocabulary operations.
        word:
          type: string
    FlashcardListResponse:
      type: object
      required: [ flashcardItems, page, size, totalElements, totalPages ]
      properties:
        flashcardItems:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardListItemResponse'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Requested zero-based page index.
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Total matching vocabulary count across all pages.
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Ceiling of totalElements divided by size; zero when no vocabulary matches.
    LessonBatchResponse:
      type: object
      required: [ total, succeeded, failed, results ]
      properties:
        total:
          type: integer
          minimum: 1
          maximum: 100
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        results:
          type: array
          minItems: 1
          maxItems: 100
          description: Exactly one result per input item, in input order; succeeded plus failed equals total.
          items:
            $ref: '#/components/schemas/LessonBatchResult'
    LessonBatchResult:
      type: object
      required: [ index, success ]
      description: Success includes lesson; failure includes error. The unused field is omitted.
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 99
          description: Zero-based position in the request array.
        success:
          type: boolean
        lesson:
          $ref: '#/components/schemas/LessonResponse'
        error:
          $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      type: object
      required: [ code, message, details ]
      properties:
        code:
          type: string
          description: Stable application error code; see each operation for relevant codes.
        message:
          type: string
          description: Safe public message without database or internal exception details.
        details:
          type: array
          items:
            type: object
            required: [ field, message ]
            properties:
              field:
                type: string
              message:
                type: string
    LessonWriteRequest:
      type: object
      required: [ levelId, lessonNumber, title, displayOrder ]
      properties:
        levelId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Existing JLPT level ID. Required and non-null.
        lessonNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Required and non-null; unique within levelId.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Required and non-null; must contain a non-whitespace character (Jakarta NotBlank).
        description:
          type: [ string, 'null' ]
          maxLength: 1000
          description: Optional. Omitted or null clears the description on update.
        displayOrder:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Required and non-null; unique within levelId.
    LessonResponse:
      description: Existing lesson representation. Null description is omitted from JSON.
      type: object
      required: [ id, lessonNumber, title ]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        lessonNumber:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
          maxLength: 200
        description:
          type: [ string, 'null' ]
          maxLength: 1000
    FlashcardDetailResponse:
      type: object
      required: [ vocabulary, readings, meanings, partsOfSpeech, levels, lessons, kanji, examples ]
      properties:
        vocabulary:
          $ref: '#/components/schemas/VocabularyResponse'
        readings:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardReadingResponse'
        meanings:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardMeaningResponse'
        partsOfSpeech:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardPartOfSpeechResponse'
        levels:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardLevelResponse'
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardLessonResponse'
        kanji:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardKanjiResponse'
        examples:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardExampleResponse'
    VocabularyResponse:
      type: object
      required: [ id, word, normalizedWord ]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Persisted vocabulary.id; vocabularyId in Admin paths.
        word:
          type: string
        normalizedWord:
          type: string
    FlashcardReadingResponse:
      type: object
      required: [ readingId, reading, isPrimary, displayOrder, pitchAccents, pitchAccentDetails ]
      properties:
        readingId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted vocabulary_readings.id; readingId in the Admin vocabulary reading PUT path.
        reading:
          type: string
        isPrimary:
          type: boolean
        displayOrder:
          type: integer
          format: int32
          description: From vocabulary_readings. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
        pitchAccents:
          type: array
          description: Existing learner representation; accent patterns only.
          items:
            type: integer
            format: int32
            minimum: 0
            maximum: 65535
        pitchAccentDetails:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardPitchAccentResponse'
    FlashcardMeaningResponse:
      type: object
      required: [ meaningId, languageCode, meaning, isPrimary, displayOrder ]
      properties:
        meaningId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted vocabulary_meanings.id; meaningId in the Admin meaning PUT path.
        languageCode:
          type: string
          description: Map to language in the Admin meaning request.
        meaning:
          type: string
        isPrimary:
          type: boolean
        displayOrder:
          type: integer
          format: int32
          description: From vocabulary_meanings. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    FlashcardPitchAccentResponse:
      type: object
      required: [ pitchAccentId, accentPattern ]
      properties:
        pitchAccentId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted vocabulary_pitch_accents.id; pitchAccentId in the Admin PUT path; the containing reading supplies readingId.
        accentPattern:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
    FlashcardLevelResponse:
      description: Nullable fields are omitted from JSON when no value is stored.
      type: object
      required: [ levelId, code, name ]
      properties:
        levelId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted jlpt_levels.id; master-data ID; together with vocabularyId identifies the vocabulary_levels assignment.
        code:
          type: string
        name:
          type: string
        displayOrder:
          type: [ integer, 'null' ]
          format: int32
          description: From vocabulary_levels, not jlpt_levels; nullable in the database. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    FlashcardLessonResponse:
      description: Nullable fields are omitted from JSON when no value is stored.
      type: object
      required: [ lessonId, levelCode, levelName, lessonNumber, title, displayOrder, assignmentDisplayOrder ]
      properties:
        lessonId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted lessons.id; master-data ID; together with vocabularyId identifies the lesson_vocabulary assignment.
        levelCode:
          type: string
        levelName:
          type: string
        lessonNumber:
          type: integer
          format: int32
          description: Lesson number within its level.
        title:
          type: string
        description:
          type: [ string, 'null' ]
        displayOrder:
          type: integer
          format: int32
          description: Existing lesson master-data order from lessons.display_order; not the editable vocabulary assignment order.
        assignmentDisplayOrder:
          type: integer
          format: int32
          description: From lesson_vocabulary.display_order (SQL INT, default 0); Admin assignment writes require a positive value.
    FlashcardPartOfSpeechResponse:
      type: object
      required: [ code, nameVi, nameEn ]
      properties:
        code:
          type: string
        nameVi:
          type: string
        nameEn:
          type: string
    FlashcardExampleResponse:
      type: object
      required: [ exampleId, japaneseText, japaneseReading, meaningVi, meaningEn, targetText, displayOrder ]
      properties:
        exampleId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted example_sentences.id; exampleId in the Admin PUT path, scoped by the vocabulary_examples association. Shared sentence content restrictions still apply.
        japaneseText:
          type: string
        japaneseReading:
          type: string
        meaningVi:
          type: string
        meaningEn:
          type: string
        targetText:
          type: string
        displayOrder:
          type: integer
          format: int32
          description: From vocabulary_examples. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    FlashcardKanjiResponse:
      description: Nullable fields are omitted from JSON when no value is stored.
      type: object
      required: [ kanjiId, character, readings, displayOrder ]
      properties:
        kanjiId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted kanji.id; kanjiId in the Admin PUT path, scoped by vocabulary_kanji. Shared metadata restrictions still apply.
        character:
          type: string
        strokeCount:
          type: [ integer, 'null' ]
          format: int32
          description: Persisted stroke count.
        meaningVi:
          type: [ string, 'null' ]
        meaningEn:
          type: [ string, 'null' ]
        readings:
          type: array
          items:
            $ref: '#/components/schemas/FlashcardKanjiReadingResponse'
        displayOrder:
          type: integer
          format: int32
          description: From vocabulary_kanji. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    FlashcardKanjiReadingResponse:
      type: object
      required: [ kanjiReadingId, reading, readingType, displayOrder ]
      properties:
        kanjiReadingId:
          type: integer
          format: int64
          minimum: 1
          description: Persisted kanji_readings.id; readingId in the nested Admin kanji reading PUT path, not a vocabulary reading ID. Shared kanji restrictions still apply.
        reading:
          type: string
        readingType:
          type: string
        displayOrder:
          type: integer
          format: int32
          description: From kanji_readings. Persisted display_order (SQL INT); Admin writes require a nonnegative value.
    AssignmentOrderUpdateRequest:
      type: object
      description: Assignment order only. Levels accept zero; lesson updates require at least 1.
      required: [ displayOrder ]
      properties:
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    KanjiReadingUpdateRequest:
      type: object
      required: [ reading, readingType, displayOrder ]
      properties:
        reading:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 100
        readingType:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank). No enum is enforced.
          maxLength: 20
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    KanjiUpdateRequest:
      type: object
      required: [ character, displayOrder ]
      properties:
        character:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 10
        strokeCount:
          type: [ integer, "null" ]
          format: int32
          description: Optional; omitted or null clears this metadata on update. Must match existing metadata when attaching existing kanji.
          minimum: 0
          maximum: 65535
        meaningVi:
          type: [ string, "null" ]
          description: Optional; omitted or null clears this metadata on update. Must match existing metadata when attaching existing kanji.
          maxLength: 500
        meaningEn:
          type: [ string, "null" ]
          description: Optional; omitted or null clears this metadata on update. Must match existing metadata when attaching existing kanji.
          maxLength: 500
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    LessonAssignmentAddRequest:
      type: object
      required: [ lessonId, displayOrder ]
      properties:
        lessonId:
          type: integer
          format: int64
          minimum: 1
        displayOrder:
          type: integer
          format: int32
          minimum: 1
    LevelAssignmentAddRequest:
      type: object
      required: [ level, displayOrder ]
      properties:
        level:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 10
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    PartOfSpeechAssignmentAddRequest:
      type: object
      required: [ code ]
      properties:
        code:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 50
    VocabularyCoreUpdateRequest:
      type: object
      required: [ word, normalizedWord ]
      properties:
        word:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 100
        normalizedWord:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 100
    VocabularyExampleUpdateRequest:
      type: object
      required: [ japaneseText, japaneseReading, meaningVi, meaningEn, targetText, displayOrder ]
      properties:
        japaneseText:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 1000
        japaneseReading:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 1000
        meaningVi:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 1000
        meaningEn:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 1000
        targetText:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 200
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    VocabularyMeaningUpdateRequest:
      type: object
      required: [ language, meaning, isPrimary, displayOrder ]
      properties:
        language:
          type: string
          enum: [ vi, en ]
          pattern: '^(vi|en)$'
        meaning:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 500
        isPrimary:
          type: boolean
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    VocabularyPitchAccentUpdateRequest:
      type: object
      required: [ readingId, accentPattern ]
      properties:
        readingId:
          type: integer
          format: int64
          minimum: 1
        accentPattern:
          type: integer
          format: int32
          minimum: 0
          maximum: 65535
    VocabularyReadingUpdateRequest:
      type: object
      required: [ reading, isPrimary, displayOrder ]
      properties:
        reading:
          type: string
          minLength: 1
          description: Must contain a non-whitespace character (Jakarta NotBlank).
          maxLength: 100
        isPrimary:
          type: boolean
        displayOrder:
          type: integer
          format: int32
          minimum: 0
    VocabularyImportItem:
      type: "object"
      required: [ "word","normalizedWord","levels","lessons","readings","meanings","partsOfSpeech","examples" ]
      properties:
        word:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Written vocabulary form. Duplicate word values within one batch are rejected."
        normalizedWord:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Caller-supplied canonical identity used to find existing vocabulary; the server does not normalize it."
        levels:
          type: "array"
          minItems: 1
          description: "Required level codes. Existing vocabulary must have exactly the same set."
          items:
            type: "string"
            enum: [ "N1","N2","N3","N4","N5" ]
        lessons:
          type: "array"
          minItems: 1
          description: "Existing lessons. Duplicate level/lessonNumber pairs are rejected; each level must occur in levels. Existing vocabulary must have exactly this lesson set."
          items:
            $ref: "#/components/schemas/LessonImportItem"
        readings:
          type: "array"
          minItems: 1
          description: "At least one entry must have isPrimary=true. Required and validated even when importing existing vocabulary."
          items:
            $ref: "#/components/schemas/VocabularyReadingImportItem"
        meanings:
          type: "array"
          minItems: 1
          description: "At least one non-null meaning; no primary-meaning requirement."
          items:
            $ref: "#/components/schemas/VocabularyMeaningImportItem"
        partsOfSpeech:
          type: "array"
          minItems: 1
          description: "Nonblank POS codes; codes must exist when creating vocabulary. Existing vocabulary keeps its current assignments."
          items:
            type: "string"
            minLength: 1
            description: "Must contain a non-whitespace character. Existing part-of-speech code."
        kanji:
          type: [ "array","null" ]
          description: "Optional; omitted, null or empty means no kanji to import. Existing vocabulary metadata is not changed."
          items:
            $ref: "#/components/schemas/VocabularyKanjiImportItem"
        pitchAccents:
          type: [ "array","null" ]
          description: "Optional; omitted, null or empty means no accents to import. Existing vocabulary readings and accents are not changed."
          items:
            $ref: "#/components/schemas/VocabularyPitchAccentImportItem"
        examples:
          type: "array"
          minItems: 1
          description: "At least one non-null example. For existing vocabulary only new examples are appended; repeated example identities are skipped."
          items:
            $ref: "#/components/schemas/VocabularyExampleImportItem"
    LessonImportItem:
      type: "object"
      required: [ "level","lessonNumber","displayOrder" ]
      properties:
        level:
          type: "string"
          enum: [ "N1","N2","N3","N4","N5" ]
          description: "Must be present in the parent levels array."
        lessonNumber:
          type: "integer"
          format: "int32"
          description: "Existing lesson number within level; not a lesson ID."
          minimum: 1
        displayOrder:
          type: "integer"
          format: "int32"
          description: "Vocabulary assignment order within the lesson."
          minimum: 1
    VocabularyReadingImportItem:
      type: "object"
      required: [ "reading" ]
      properties:
        reading:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Vocabulary reading."
        isPrimary:
          type: "boolean"
          default: false
          description: "Omitted value defaults to false."
        displayOrder:
          type: "integer"
          format: "int32"
          description: "Omitted value defaults to 0."
          default: 0
    VocabularyMeaningImportItem:
      type: "object"
      required: [ "language","meaning" ]
      properties:
        language:
          type: "string"
          enum: [ "vi","en" ]
          description: "Language code; the flashcard response calls this languageCode."
        meaning:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Meaning in the selected language."
        isPrimary:
          type: "boolean"
          default: false
          description: "Omitted value defaults to false."
        displayOrder:
          type: "integer"
          format: "int32"
          description: "Omitted value defaults to 0."
          default: 0
    VocabularyPitchAccentImportItem:
      type: "object"
      required: [ "reading" ]
      properties:
        reading:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Must identify a vocabulary reading when creating new vocabulary."
        accentPattern:
          type: "integer"
          format: "int32"
          description: "Pitch accent pattern; omitted value defaults to 0."
          minimum: 0
          default: 0
    VocabularyKanjiImportItem:
      type: "object"
      required: [ "character","readings" ]
      properties:
        character:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Kanji character."
        strokeCount:
          type: [ "integer","null" ]
          format: "int32"
          description: "Optional stroke count."
        meaningVi:
          type: [ "string","null" ]
          description: "Optional Vietnamese meaning."
        meaningEn:
          type: [ "string","null" ]
          description: "Optional English meaning."
        readings:
          type: "array"
          minItems: 1
          description: "At least one non-null reading is required for each supplied kanji."
          items:
            $ref: "#/components/schemas/KanjiReadingImportItem"
    KanjiReadingImportItem:
      type: "object"
      required: [ "reading","readingType" ]
      properties:
        reading:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Kanji reading."
        readingType:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Reading type; the import validator does not enforce an enum."
        displayOrder:
          type: "integer"
          format: "int32"
          description: "Omitted value defaults to 0."
          default: 0
    VocabularyExampleImportItem:
      type: "object"
      required: [ "japaneseText","japaneseReading","meaningVi","meaningEn","targetText" ]
      properties:
        japaneseText:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Japanese sentence."
        japaneseReading:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Sentence reading."
        meaningVi:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Vietnamese translation."
        meaningEn:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. English translation."
        targetText:
          type: "string"
          minLength: 1
          description: "Must contain a non-whitespace character. Vocabulary-specific target text in the sentence."
        displayOrder:
          type: "integer"
          format: "int32"
          description: "Omitted value defaults to 0."
          default: 0
    ImportResult:
      type: object
      required: [ total, created, updated ]
      description: created plus updated equals total; the entire batch committed successfully.
      properties:
        total:
          type: integer
          format: int32
        created:
          description: Number of newly created vocabularies
          type: integer
          format: int32
        updated:
          description: Existing vocabularies with matching assignments processed for examples, including unchanged repeats
          type: integer
          format: int32
    ResponseMeta:
      type: object
      required: [ timestamp, traceId, correlationId ]
      description: Response timestamp and request identifiers are nested here, not at the envelope root.
      properties:
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        correlationId:
          type: string
    AdminEditResponse:
      type: object
      required: [ success, meta ]
      description: Common ApiResponse success envelope (legacy schema name). data is the operation-specific result; error is omitted.
      properties:
        success:
          type: boolean
          const: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VocabularyCoreResult:
      type: object
      required: [ vocabularyId ]
      properties:
        vocabularyId:
          type: integer
          format: int64
    VocabularyReadingResult:
      type: object
      required: [ readingId ]
      properties:
        readingId:
          type: integer
          format: int64
    VocabularyMeaningResult:
      type: object
      required: [ meaningId ]
      properties:
        meaningId:
          type: integer
          format: int64
    VocabularyPitchAccentResult:
      type: object
      required: [ pitchAccentId ]
      properties:
        pitchAccentId:
          type: integer
          format: int64
    VocabularyExampleResult:
      type: object
      required: [ exampleId ]
      properties:
        exampleId:
          type: integer
          format: int64
    VocabularyLevelResult:
      type: object
      required: [ levelId ]
      properties:
        levelId:
          type: integer
          format: int64
    VocabularyLessonResult:
      type: object
      required: [ lessonId ]
      properties:
        lessonId:
          type: integer
          format: int64
    VocabularyPartOfSpeechResult:
      type: object
      required: [ partOfSpeechId ]
      properties:
        partOfSpeechId:
          type: integer
          format: int64
    VocabularyKanjiResult:
      type: object
      required: [ kanjiId ]
      properties:
        kanjiId:
          type: integer
          format: int64
    KanjiReadingResult:
      type: object
      required: [ kanjiReadingId ]
      properties:
        kanjiReadingId:
          type: integer
          format: int64
    AdminEditErrorResponse:
      type: object
      required: [ success, error, meta ]
      description: Error envelope. data is omitted. Validation details may be empty; clients must not assume field details for every 400.
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorResponse'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
