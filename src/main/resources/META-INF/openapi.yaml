    get:
      operationId: "listQuizQuestions"
      summary: "Search the Admin question bank"
      tags:
        - "Admin Kanji Quiz"
      description: "Requires the case-sensitive Admin role. Returns full Admin details, newest ID first. Filters combine with AND; no filter means all sources/statuses, including stale PUBLISHED questions. A tagged lesson implies its level. Both levelId and lessonId require that lesson to belong to that level. Keyword is a literal trimmed substring of reading, targetReading or VI/EN explanations, not SQL wildcards. All mutations require the current version except creation. Failed writes roll back completely."
