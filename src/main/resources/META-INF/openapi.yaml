        - bearerAuth: [ ]
      parameters:
        - name: "sourceType"
          in: "query"
          description: "Optional exact source type."
          schema:
            type: "string"
            enum:
              - "EXAMPLE"
              - "CUSTOM"
            description: "Immutable after creation."
        - name: "status"
          in: "query"
          description: "Optional editorial status, independent of source validity."
          schema:
            type: "string"
            enum:
              - "DRAFT"
              - "PUBLISHED"
              - "ARCHIVED"
        - name: "levelId"
          in: "query"
          description: "Optional JLPT level ID, not level code."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
        - name: "lessonId"
          in: "query"
          description: "Optional lesson ID, not lesson number."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
        - name: "vocabularyId"
          in: "query"
          description: "Optional assigned vocabulary ID."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
        - name: "exampleId"
          in: "query"
          description: "Optional source example ID."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
        - name: "keyword"
          in: "query"
          description: "Optional literal substring; trimmed; blank ignored."
          schema:
            type: "string"
            maxLength: 200
        - name: "page"
          in: "query"
          description: "Zero-based page; (page + 1) * size must fit int32."
          schema:
            type: "integer"
            format: "int64"
            minimum: 0
            default: 0
        - name: "size"
          in: "query"
          description: "Page size 1-100."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
            maximum: 100
            default: 20
