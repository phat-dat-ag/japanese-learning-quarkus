    AdminEditErrorResponse:
      type: object
      required: [ success, error, meta ]
      description: Error envelope. data is omitted. Validation details may be empty; clients must not assume field details for every 400.
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [ code, message, details ]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              description: Empty for DTO validation, authentication, authorization, not-found and conflict errors. Service validation may supply field and message entries.
              items:
                type: object
                required: [ field, message ]
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
  responses:
    AdminEditErrorResponseStatus400:
      description: BAD_REQUEST for malformed JSON, parameter binding or Jakarta input validation (empty details); VALIDATION_ERROR for business validation (field details).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus401:
      description: UNAUTHORIZED - missing, invalid or expired JWT bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus403:
      description: FORBIDDEN - authenticated caller lacks the case-sensitive Admin role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus404:
      description: RESOURCE_NOT_FOUND - vocabulary, child, assignment or referenced master data does not exist in the required parent relationship
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus409:
      description: VOCABULARY_EDIT_CONFLICT - duplicate value or protected shared-data modification
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus415:
      description: UNSUPPORTED_MEDIA_TYPE - request Content-Type must be application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus500:
      description: INTERNAL_SERVER_ERROR - unexpected server failure; no internal diagnostic details are exposed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
