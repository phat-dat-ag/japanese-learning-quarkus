components:
  schemas:
    ImportResult:
      type: object
      properties:
        total:
          type: integer
          format: int32
        created:
          description: Number of newly created vocabularies
          type: integer
          format: int32
        updated:
          description: Existing vocabularies with matching assignments processed for examples, including unchanged repeats
          type: integer
          format: int32
    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        correlationId:
          type: string
    AdminEditResponse:
      type: object
      properties:
        success:
          type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VocabularyCoreResult:
      type: object
      required: [ vocabularyId ]
      properties:
        vocabularyId:
          type: integer
          format: int64
    VocabularyReadingResult:
      type: object
      required: [ readingId ]
      properties:
        readingId:
          type: integer
          format: int64
    VocabularyMeaningResult:
      type: object
      required: [ meaningId ]
      properties:
        meaningId:
          type: integer
          format: int64
    VocabularyPitchAccentResult:
      type: object
      required: [ pitchAccentId ]
      properties:
        pitchAccentId:
          type: integer
          format: int64
    VocabularyExampleResult:
      type: object
      required: [ exampleId ]
      properties:
        exampleId:
          type: integer
          format: int64
    VocabularyLevelResult:
      type: object
      required: [ levelId ]
      properties:
        levelId:
          type: integer
          format: int64
    VocabularyLessonResult:
      type: object
      required: [ lessonId ]
      properties:
        lessonId:
          type: integer
          format: int64
    VocabularyPartOfSpeechResult:
      type: object
      required: [ partOfSpeechId ]
      properties:
        partOfSpeechId:
          type: integer
          format: int64
    VocabularyKanjiResult:
      type: object
      required: [ kanjiId ]
      properties:
        kanjiId:
          type: integer
          format: int64
    KanjiReadingResult:
      type: object
      required: [ kanjiReadingId ]
      properties:
        kanjiReadingId:
          type: integer
          format: int64
    AdminEditErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
  responses:
    AdminEditErrorResponseStatus400:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus401:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus403:
      description: Admin role required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus404:
      description: Vocabulary, child, assignment or referenced master data not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus409:
      description: Duplicate value or shared-data edit conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
