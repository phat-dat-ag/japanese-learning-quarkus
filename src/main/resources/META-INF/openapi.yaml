components:
  schemas:
    ImportResult:
      type: object
      properties:
        total:
          type: integer
          format: int32
        created:
          description: Number of newly created vocabularies
          type: integer
          format: int32
        updated:
          description: Existing vocabularies with matching assignments processed for examples, including unchanged repeats
          type: integer
          format: int32
    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        correlationId:
          type: string
    AdminEditResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/EditResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AdminEditBatchResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/EditResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EditResult:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Child ID; for assignments this is the referenced master ID
    AdminEditErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
  responses:
    AdminEditResponseStatus200:
      description: Operation completed atomically
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditResponse'
    AdminEditErrorResponseStatus400:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus401:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus403:
      description: Admin role required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus404:
      description: Vocabulary, child, assignment or referenced master data not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditErrorResponseStatus409:
      description: Duplicate value or shared-data edit conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditErrorResponse'
    AdminEditBatchResponseStatus200:
      description: Operation completed atomically
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminEditBatchResponse'
