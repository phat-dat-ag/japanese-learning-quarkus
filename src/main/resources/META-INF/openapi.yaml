openapi: 3.1.0
security:
  - bearerAuth: [ ]
paths:
  /api/vocabularies:
    post:
      responses:
        '200':
          description: Batch processed atomically. New vocabulary is fully created; matching existing vocabulary receives only new examples.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ImportResult'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Invalid vocabulary batch, assignment mismatch, missing lesson, or configured batch limit exceeded
        '401':
          description: Bearer token required
        '403':
          description: Admin role required
  /api/v1/admin/vocabularies/{vocabularyId}:
    put:
      responses:
        '200':
          $ref: '#/components/responses/AdminEditResponseStatus200'
        '400':
